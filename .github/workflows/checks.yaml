name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'uv==0.12.19'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --frozen python -m unittest discover -s tests -v

  distribution:
    name: Build and installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'uv==0.12.19'
      - run: python scripts/check_distribution.py

  consumer:
    name: Hidden Moves consumer (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'uv==0.12.19'
      - name: Build and install library wheel
        shell: bash
        run: |
          uv build --out-dir "$RUNNER_TEMP/library-dist"
          uv venv "$RUNNER_TEMP/consumer-env" --python '${{ matrix.python }}'
          uv pip install --python "$RUNNER_TEMP/consumer-env/bin/python" "$RUNNER_TEMP/library-dist/"*.whl
      - uses: actions/checkout@v4
        with:
          repository: outside-labs/hidden_moves
          ref: 6fa99794301efcce34cbed56e7c7b7eef162a184
          path: .consumer
          persist-credentials: false
      - name: Conformance against the actual consumer API
        shell: bash
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE/examples:$GITHUB_WORKSPACE/.consumer/src"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/consumer-env/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/consumer_tests" -v
