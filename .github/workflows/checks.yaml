name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install 'uv==0.12.19'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run --frozen python -m unittest discover -s tests -v

  distribution:
    name: Build and installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'uv==0.12.19'
      - run: uv build
      - name: Check installed distribution outside source checkout
        shell: bash
        run: |
          wheel_env="${RUNNER_TEMP}/expose-wheel"
          uv venv "$wheel_env" --python 3.14
          uv pip install --python "$wheel_env/bin/python" dist/*.whl
          uv pip check --python "$wheel_env/bin/python"
          cd "$RUNNER_TEMP"
          "$wheel_env/bin/python" -I -c "from importlib.metadata import distribution; assert not distribution('expose-interface').requires"
          "$wheel_env/bin/expose-interface" --help
          "$wheel_env/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
