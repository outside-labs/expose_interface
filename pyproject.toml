[project]
name = "expose-interface"
version = "0.1.0"
description = "Export ordinary Python functions as command line programs."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
expose-interface = "expose_interface:main"

[project.urls]
Source = "https://github.com/outside-labs/expose_interface"
Issues = "https://github.com/outside-labs/expose_interface/issues"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
